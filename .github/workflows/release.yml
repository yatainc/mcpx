name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.asset_suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_suffix: linux-x64
          - runner: macos-14
            asset_suffix: macos-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify
        run: |
          set -euxo pipefail
          test "${GITHUB_REF_TYPE}" = "tag"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' moon.mod)"
          test -n "$manifest_version"
          test "${GITHUB_REF_NAME}" = "v${manifest_version}"
          test -f ".github/release-notes/${GITHUB_REF_NAME}.md"
          nix develop --command moon fmt --check
          nix develop --command moon check --target native --warn-list +73 --deny-warn
          nix develop --command moon check --target wasm-gc --warn-list +73 --deny-warn
          nix develop --command moon check --target js --warn-list +73 --deny-warn
          nix develop --command moon test --target native --no-render
          nix develop --command moon test --target wasm-gc --no-render
          nix develop --command moon test --target js --no-render
          nix develop --command bash scripts/e2e.sh
          nix develop --command env MCPX_BENCH_ENFORCE=1 MCPX_BENCH_CLI_RUNS=5 MCPX_BENCH_MEMORY_RUNS=3 bash scripts/benchmark.sh

      - name: Build native release
        run: |
          set -euxo pipefail
          nix build --out-link result

      - name: Package
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(result/bin/mcpx --version)" = "mcpx ${version#v}"
          asset="mcpx-${version}-${{ matrix.asset_suffix }}.tar.gz"
          mkdir -p dist
          cp result/bin/mcpx dist/mcpx
          chmod +x dist/mcpx
          tar -czf "$asset" -C dist mcpx
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -euxo pipefail
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS

      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          body_path: .github/release-notes/${{ github.ref_name }}.md

  action-timeline:
    name: Show workflow timeline
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@44c9c178ffb2fb1d9859614a3ffa79ccfb77565e # v3.1.0
